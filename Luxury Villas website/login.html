<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villa Real Estate - Login</title>

 <!-- Bootstrap -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 35px;
      color: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h2 {
      font-weight: bold;
      letter-spacing: 1px;
    }

    .form-control {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 12px;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.2);
      color: white;
      box-shadow: none;
      border: 1px solid #fff;
    }

    .input-group-text {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff7a00;
      color: white;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

   
    .extra-links {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 14px;
    }

    .extra-links a {
      color: #fff;
      text-decoration: none;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .error {
      color: #ffb3b3;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }

    .success-message {
      text-align: center;
      color: #90ee90;
      margin-top: 15px;
      display: none;
      font-weight: bold;
    }

    .password-strength {
      height: 6px;
      width: 100%;
      background: #ccc;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h2><i class="fa-solid fa-house"></i> Vella Estate</h2>
      <p>Luxury Real Estate Portal</p>
    </div>

    <form id="loginForm">

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
          />
        </div>
        <div class="error" id="emailError">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-lock"></i>
          </span>

          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
          />

          <span class="input-group-text" id="togglePassword" style="cursor:pointer;">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <!-- Password Strength -->
        <div class="password-strength">
          <div class="strength-bar" id="strengthBar"></div>
        </div>

        <div class="error" id="passwordError">
          Password must contain at least 8 characters.
        </div>
      </div>

      <!-- Remember Me -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember" />
        <label class="form-check-label" for="remember">
          Remember Me
        </label>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn-login">
        Login
      </button>

      <!-- Success Message -->
      <div class="success-message" id="successMessage">
        Login Successful ✅
      </div>

      <!-- Extra Links -->
      <div class="extra-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Create Account</a>
      </div>

    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const successMessage = document.getElementById('successMessage');
    const togglePassword = document.getElementById('togglePassword');
    const strengthBar = document.getElementById('strengthBar');

    // Email Validation
    function validateEmail() {
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      if (!email.value.match(emailPattern)) {
        emailError.style.display = 'block';
        return false;
      }

      emailError.style.display = 'none';
      return true;
    }

    // Password Validation
    function validatePassword() {
      if (password.value.length < 8) {
        passwordError.style.display = 'block';
        return false;
      }

      passwordError.style.display = 'none';
      return true;
    }

    // Password Strength Checker
    password.addEventListener('input', () => {
      let strength = 0;
      const value = password.value;

      if (value.length >= 8) strength++;
      if (/[A-Z]/.test(value)) strength++;
      if (/[0-9]/.test(value)) strength++;
      if (/[@$!%*?&]/.test(value)) strength++;

      switch(strength) {
        case 1:
          strengthBar.style.width = '25%';
          strengthBar.style.background = 'red';
          break;

        case 2:
          strengthBar.style.width = '50%';
          strengthBar.style.background = 'orange';
          break;

        case 3:
          strengthBar.style.width = '75%';
          strengthBar.style.background = 'yellow';
          break;

        case 4:
          strengthBar.style.width = '100%';
          strengthBar.style.background = 'lime';
          break;

        default:
          strengthBar.style.width = '0%';
      }
    });

    // Real Time Validation
    email.addEventListener('keyup', validateEmail);
    password.addEventListener('keyup', validatePassword);

    // Show / Hide Password
    togglePassword.addEventListener('click', () => {
      const type = password.getAttribute('type') === 'password'
        ? 'text'
        : 'password';

      password.setAttribute('type', type);

      togglePassword.innerHTML = type === 'password'
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    });

    // Form Submit
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();

      if (isEmailValid && isPasswordValid) {
        successMessage.style.display = 'block';

        // Example Local Storage
        if (document.getElementById('remember').checked) {
          localStorage.setItem('savedEmail', email.value);
        }

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      }
    });

    // Auto Fill Saved Email
    window.onload = () => {
      const savedEmail = localStorage.getItem('savedEmail');

      if (savedEmail) {
        email.value = savedEmail;
      }
    };
  </script>

</body>
</html>
