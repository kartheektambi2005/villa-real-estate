<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – VILLA Agency</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="container">
  <div class="auth-card">
    <!-- Logo -->
    <a href="index.html" class="auth-logo">VILLA</a>
    <p class="auth-subtitle">Sunny Isles Beach, FL 33160</p>

    <h2 class="auth-title">Welcome Back</h2>
    <p style="font-size:13px; color:#888; margin-bottom:28px;">Sign in to access your account & wishlist</p>

    <div id="loginError" class="error-msg"></div>
    <div id="loginSuccess" class="success-msg"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com">
      <div class="field-error" id="loginEmailErr">Please enter a valid email.</div>
    </div>

    <div class="form-group" style="position:relative;">
      <label class="form-label">Password</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
      <i class="bi bi-eye-slash" id="togglePass" style="position:absolute; right:12px; top:36px; cursor:pointer; color:#888;"></i>
      <div class="field-error" id="loginPassErr">Please enter your password.</div>
    </div>

    <button class="btn-auth" id="loginBtn">Login</button>

    <div class="auth-divider mt-4">or</div>

    <p style="text-align:center; font-size:13px; color:#888; margin-top:16px;">
      Don't have an account?
      <a href="register.html" class="auth-link">Register here</a>
    </p>

    <p style="text-align:center; margin-top:12px;">
      <a href="index.html" style="font-size:12px; color:#aaa;">← Back to Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/script.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  // Toggle password
  document.getElementById('togglePass').addEventListener('click', function() {
    const input = document.getElementById('loginPassword');
    if (input.type === 'password') {
      input.type = 'text';
      this.className = 'bi bi-eye';
    } else {
      input.type = 'password';
      this.className = 'bi bi-eye-slash';
    }
  });

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const sucEl = document.getElementById('loginSuccess');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    // Validate
    let valid = true;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('loginEmailErr').style.display = 'block';
      document.getElementById('loginEmail').classList.add('is-invalid');
      valid = false;
    } else {
      document.getElementById('loginEmailErr').style.display = 'none';
      document.getElementById('loginEmail').classList.remove('is-invalid');
    }
    if (!password) {
      document.getElementById('loginPassErr').style.display = 'block';
      document.getElementById('loginPassword').classList.add('is-invalid');
      valid = false;
    } else {
      document.getElementById('loginPassErr').style.display = 'none';
      document.getElementById('loginPassword').classList.remove('is-invalid');
    }
    if (!valid) return;

    const result = Auth.login(email, password);
    if (result.ok) {
      sucEl.textContent = `Welcome back, ${result.user.fullName}! Redirecting...`;
      sucEl.style.display = 'block';
      setTimeout(() => window.location.href = 'index.html', 1200);
    } else {
      errEl.textContent = result.error;
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
